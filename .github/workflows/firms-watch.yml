name: FIRMS Hotspot Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Query FIRMS and filter polygon
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FIRMS_LOOKBACK_DAYS: "3"
        run: python watch.py

      - name: Publish status files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/status.json data/seen.json data/events.jsonl data/summary.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FIRMS hotspot status"
            git pull --rebase origin main
            git push
          fi
